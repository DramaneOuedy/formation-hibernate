spring.application.name=gestion

# --- Base MySQL locale (creation du compte : voir README.md) ---
spring.datasource.url=jdbc:mysql://localhost:3306/formation_hibernate?createDatabaseIfNotExist=true
spring.datasource.username=formation
spring.datasource.password=formation

# create : chaque lancement d'un TP repart d'une base vide (scenarios reproductibles).
# En projet reel : validate + Flyway ou Liquibase, jamais create/update en production.
spring.jpa.hibernate.ddl-auto=create

# Indispensable en formation : sinon Spring garde la session ouverte
# et la LazyInitializationException n'apparait jamais (module 3)
spring.jpa.open-in-view=false

# --- SQL lisible dans la console ---
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Moins de bruit au demarrage
spring.main.banner-mode=off
logging.level.org.springframework=warn

# --- Module 6 : performance ---
spring.jpa.properties.hibernate.generate_statistics=true
# le resume de statistiques par session est tres verbeux : on le coupe
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=warn
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- Module 7 : cache de 2e niveau ---
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
